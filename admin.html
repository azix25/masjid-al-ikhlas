<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Masjid Al Ikhlas</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="admin.js" defer></script>

</head>

<body>

<main class="admin-container">


    <!-- LOGIN -->

    <section id="loginBox" class="login-card">

        <div class="login-logo">
            🕌
        </div>

        <h1>Admin Masjid</h1>

        <p>
            Silakan login untuk mengelola keuangan.
        </p>


        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email admin"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                🔐 Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </section>


    <!-- DASHBOARD -->

    <section id="adminPanel" hidden>

        <div class="admin-header">

            <div>
                <span class="section-label">
                    ADMINISTRATOR
                </span>

                <h1>Dashboard Keuangan</h1>
            </div>

            <button id="logoutBtn"
                    class="btn-danger">
                Keluar
            </button>

        </div>


        <section class="stats">

            <div class="stat-card masuk">

                <div class="stat-icon">
                    📥
                </div>

                <div>
                    <span>Uang Masuk</span>
                    <strong id="adminMasuk">
                        Rp 0
                    </strong>
                </div>

            </div>


            <div class="stat-card keluar">

                <div class="stat-icon">
                    📤
                </div>

                <div>
                    <span>Uang Keluar</span>
                    <strong id="adminKeluar">
                        Rp 0
                    </strong>
                </div>

            </div>


            <div class="saldo-card">

                <div>

                    <span>Saldo</span>

                    <h2 id="adminSaldo">
                        Rp 0
                    </h2>

                </div>

            </div>

        </section>


        <section class="admin-form">

            <h2>Tambah Transaksi</h2>

            <form id="transactionForm">

                <input
                    type="date"
                    id="tanggal"
                    required
                >

                <input
                    type="text"
                    id="keterangan"
                    placeholder="Keterangan"
                    required
                >

                <select id="jenis" required>

                    <option value="masuk">
                        Uang Masuk
                    </option>

                    <option value="keluar">
                        Uang Keluar
                    </option>

                </select>


                <input
                    type="number"
                    id="nominal"
                    placeholder="Nominal"
                    min="1"
                    required
                >


                <button type="submit">
                    + Simpan Transaksi
                </button>

            </form>

            <p id="formMessage"></p>

        </section>


        <section class="admin-table">

            <h2>Kelola Transaksi</h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Jenis</th>
                            <th>Nominal</th>
                            <th>Aksi</th>

                        </tr>

                    </thead>

                    <tbody id="adminTableBody"></tbody>

                </table>

            </div>

        </section>

    </section>

</main>

</body>
</html>
